<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conference Brochure</title><style>body{margin:0;background:#f4f4f4;color:#333;font-family:Arial,sans-serif}.bar{padding:18px 22px;background:#202020;color:#fff;font-size:23px}.card{width:min(100% - 44px,860px);margin:18px auto;padding:26px 16px 32px;background:#f5f5f5;border:1px solid #ccc;box-sizing:border-box}.card h1{margin:0 0 24px;color:#a52d43;font-size:22px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field label::after{content:'*';color:#c21f2d}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:9px 12px;border:1px solid #aaa;background:#fff;font:14px Arial}.field textarea{height:92px;resize:vertical}.captcha-row{display:flex;align-items:center;gap:10px}.captcha{width:95px;height:38px;border:1px solid #aaa;background:#fff;display:grid;place-items:center;color:#263c51;font:bold 22px Georgia;letter-spacing:3px;text-decoration:line-through}.captcha-row input{width:100px}.refresh{border:0;background:none;color:#24627e;cursor:pointer;font-size:12px}.actions{margin-top:24px;display:flex;align-items:center;gap:12px}.actions button{padding:11px 24px;border:0;background:#2c7892;color:white;cursor:pointer}.message{margin-top:15px;color:#287142;font-size:14px}.error{color:#b52d36;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}</style></head><body><header class="bar">Conference Brochure</header><main class="card"><h1>Enter Your Details</h1><form id="brochure-form"><div class="grid"><div class="field"><label>Name</label><input name="name" placeholder="Enter Name" required></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="Enter Email" required></div><div class="field"><label>Phone</label><input name="phone" placeholder="Enter Phone" required></div><div class="field"><label>Select Country/Region</label><select name="country" required><option value="">Select</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Italy</option><option>Spain</option><option>Other</option></select></div><div class="field wide"><label>Your Message</label><textarea name="message" placeholder="Message"></textarea></div><div class="field"><label>Captcha Code</label><div class="captcha-row"><span class="captcha" id="captcha"></span><button type="button" class="refresh" id="refresh">Generate new code</button></div></div><div class="field"><label>Enter Captcha</label><input name="captcha" placeholder="Enter Code" required></div></div><div class="actions"><button type="submit">Submit</button><span class="error" id="error"></span></div><div class="message" id="message"></div></form></main><script>(function(){const p=new URLSearchParams(location.search),eventId=p.get('event')||'global',resource=p.get('resource')||'/event-site/index.html';const key='velentra-brochure-downloads-'+eventId;let code='';const captcha=document.getElementById('captcha'),error=document.getElementById('error'),message=document.getElementById('message');const generate=()=>{code=Math.random().toString(36).slice(2,7).toUpperCase();captcha.textContent=code};generate();document.getElementById('refresh').onclick=generate;document.getElementById('brochure-form').addEventListener('submit',e=>{e.preventDefault();error.textContent='';message.textContent='';const data=Object.fromEntries(new FormData(e.currentTarget).entries());if(String(data.captcha).trim().toUpperCase()!==code){error.textContent='Captcha code does not match.';generate();return}let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch{};rows.push({id:'download-'+Date.now(),serial:rows.length+1,date:new Date().toISOString().slice(0,10),name:data.name,email:data.email,country:data.country,phone:data.phone,address:data.message||'—',href:resource,isDownload:true});localStorage.setItem(key,JSON.stringify(rows));message.textContent='Details submitted successfully. Your brochure request has been recorded.';e.currentTarget.reset();generate()})})();</script></body></html>
