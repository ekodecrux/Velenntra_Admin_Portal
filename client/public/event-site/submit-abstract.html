<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit Abstract</title><style>body{margin:0;background:#f4f4f4;color:#333;font-family:Arial,sans-serif}.bar{padding:18px 22px;background:#202020;color:#fff;font-size:23px}.card{width:min(100% - 44px,900px);margin:18px auto;padding:26px 16px 32px;background:#f5f5f5;border:1px solid #ccc;box-sizing:border-box}.card h1{margin:0 0 24px;color:#2b7892;font-size:22px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field label::after{content:'*';color:#c21f2d}.field input,.field select,.field textarea{box-sizing:border-box;width:100%;padding:9px 12px;border:1px solid #aaa;background:#fff;font:14px Arial}.field textarea{height:110px;resize:vertical}.captcha-row{display:flex;align-items:center;gap:10px}.captcha{width:95px;height:38px;border:1px solid #aaa;background:#fff;display:grid;place-items:center;color:#263c51;font:bold 22px Georgia;letter-spacing:3px;text-decoration:line-through}.refresh{border:0;background:none;color:#24627e;cursor:pointer;font-size:12px}.actions{margin-top:24px;display:flex;align-items:center;gap:12px}.actions button{padding:11px 24px;border:0;background:#2c7892;color:#fff;cursor:pointer}.message{margin-top:15px;color:#287142;font-size:14px}.error{color:#b52d36;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}</style></head><body><header class="bar">Submit Abstract</header><main class="card"><h1>Abstract Submission</h1><form id="abstract-form"><div class="grid"><div class="field"><label>Name</label><input name="name" placeholder="Enter Name" required></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="Enter Email" required></div><div class="field"><label>Country</label><input name="country" required></div><div class="field"><label>Phone No</label><input name="phone"></div><div class="field wide"><label>Abstract Title</label><input name="abstractTitle" required></div><div class="field"><label>Category</label><input name="category"></div><div class="field"><label>Track Name</label><input name="trackName"></div><div class="field wide"><label>Address</label><input name="address"></div><div class="field"><label>Interested</label><select name="interested"><option>Yes</option><option>No</option></select></div><div class="field"><label>Organization</label><input name="organization"></div><div class="field"><label>Date</label><input name="date" type="date" value=""></div><div class="field"><label>Captcha Code</label><div class="captcha-row"><span class="captcha" id="captcha"></span><button type="button" class="refresh" id="refresh">Generate new code</button></div></div><div class="field"><label>Enter Captcha</label><input name="captcha" placeholder="Enter Code" required></div><div class="field wide"><label>Abstract Details</label><textarea name="details" placeholder="Enter abstract details"></textarea></div></div><div class="actions"><button type="submit">Submit Abstract</button><span class="error" id="error"></span></div><div class="message" id="message"></div></form></main><script>(function(){const p=new URLSearchParams(location.search),eventId=p.get('event')||'global',key='velentra-abstracts-'+eventId;document.querySelector('[name=date]').value=new Date().toISOString().slice(0,10);let code='';const captcha=document.getElementById('captcha'),error=document.getElementById('error'),message=document.getElementById('message');const generate=()=>{code=Math.random().toString(36).slice(2,7).toUpperCase();captcha.textContent=code};generate();document.getElementById('refresh').onclick=generate;document.getElementById('abstract-form').addEventListener('submit',e=>{e.preventDefault();error.textContent='';message.textContent='';const data=Object.fromEntries(new FormData(e.currentTarget).entries());if(String(data.captcha).trim().toUpperCase()!==code){error.textContent='Captcha code does not match.';generate();return}let rows=[];try{rows=JSON.parse(localStorage.getItem(key)||'[]')}catch{};rows.push({id:'abstract-'+Date.now(),name:data.name,abstractTitle:data.abstractTitle,email:data.email,country:data.country,phone:data.phone,category:data.category,trackName:data.trackName,address:data.address,interested:data.interested,organization:data.organization,date:data.date,details:data.details,status:'In review'});localStorage.setItem(key,JSON.stringify(rows));message.textContent='Abstract submitted successfully. It is now visible in the event Abstracts list.';e.currentTarget.reset();generate()})})();</script></body></html>
