name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: velentra-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy main to production VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
          VPS_SERVICE: ${{ secrets.VPS_SERVICE }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_APP_PATH"
          test -n "$VPS_SERVICE"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/velentra_deploy_key"
          chmod 600 "$HOME/.ssh/velentra_deploy_key"
          ssh-keyscan -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/velentra_deploy_key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" \
            "VPS_APP_PATH='$VPS_APP_PATH' VPS_SERVICE='$VPS_SERVICE' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$VPS_APP_PATH"
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          corepack enable
          corepack prepare pnpm@10.18.0 --activate
          pnpm install --frozen-lockfile
          pnpm db:migrate
          pnpm build
          sudo systemctl restart "$VPS_SERVICE"
          sleep 3
          sudo systemctl is-active --quiet "$VPS_SERVICE"
          curl --fail --silent --show-error --max-time 15 http://127.0.0.1:3000/api/health
          printf '\nDeployment completed: %s\n' "$(git rev-parse --short HEAD)"
          REMOTE
